<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f14">
<title>Chat Salas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0f0f14; --panel:#16161d; --panel2:#1d1d27; --border:#2a2a38;
  --text:#f2f2f5; --muted:#9a9aad; --accent:#6c5ce7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;overflow:hidden}
button,input{font:inherit}
#sidebar{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px}
.side-head h1{font-size:17px;font-weight:600}
.room{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;color:var(--muted);border-left:3px solid transparent}
.room:hover{background:var(--panel2)}
.room.active{background:var(--panel2);color:var(--text);border-left-color:var(--accent)}
.room .dot{width:9px;height:9px;border-radius:50%;flex:none}
.room span.nm{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox{padding:14px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h2{font-size:16px;font-weight:600}
header .m{font-size:12px;color:var(--muted)}
.online{width:8px;height:8px;border-radius:50%;background:#2ecc71;flex:none}
#menuBtn{display:none;width:34px;height:34px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;cursor:pointer;font-size:16px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex:none}
.bdy{max-width:78%}
.meta{display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
.meta .u{font-size:13px;font-weight:600}
.meta .t{font-size:11px;color:var(--muted)}
.bbl{font-size:14px;line-height:20px;padding:8px 12px;border-radius:12px;background:var(--panel2);width:fit-content;overflow-wrap:anywhere}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bbl{background:var(--accent);color:#fff}
#composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
#inp{flex:1;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:16px;background:var(--panel2);color:var(--text);outline:none}
#inp:focus{border-color:var(--accent)}
#send{width:44px;height:44px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:18px;flex:none}
#send:active{opacity:.85}
#conn{font-size:11px;padding:4px 16px;color:var(--muted);background:var(--panel);text-align:center}
@media(max-width:640px){
  #sidebar{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #menuBtn{display:block}
  .bdy{max-width:85%}
}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="side-head"><h1>Salas</h1></div>
  <div id="rooms"></div>
  <div class="userbox" id="userbox"></div>
</nav>

<div id="main">
  <header>
    <button id="menuBtn">☰</button>
    <span class="online"></span>
    <h2 id="roomName">—</h2>
    <span class="m" id="roomCount"></span>
  </header>
  <div id="conn">conectando…</div>
  <div id="msgs"></div>
  <div id="composer">
    <input id="inp" placeholder="Escribe un mensaje…" autocomplete="off" enterkeyhint="send">
    <button id="send" title="Enviar">➤</button>
  </div>
</div>

<script type="module">
// ═══ CONFIGURACIÓN: pegá acá tus datos de Supabase ═══
const SUPABASE_URL = "https://zqjeuqtygxfxdngvdwhz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dS5Hp3mZnEUSNjJv32ufeQ_XLNF0TXD";
// ═══════════════════════════════════════════════════════

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ROOMS = [
  {id:"general",   name:"General",       color:"#8e8ea0"},
  {id:"progra",    name:"Programación",  color:"#3498db"},
  {id:"musica",    name:"Música",        color:"#9b59b6"},
  {id:"cine",      name:"Cine y series", color:"#e74c3c"},
  {id:"juegos",    name:"Juegos",        color:"#2ecc71"},
  {id:"curiosidad",name:"Curiosidades",  color:"#f39c12"},
];

let user = localStorage.getItem("chat_user");
if (!user) {
  user = prompt("¿Cómo te llamás?")?.trim().slice(0,20) || "Anónimo" + Math.floor(Math.random()*999);
  localStorage.setItem("chat_user", user);
}

let active = "general";
const seen = new Set();
const $ = id => document.getElementById(id);
const initials = n => n.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const hcolor = n => { let h=0; for (const c of n) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h},55%,55%)`; };
const now = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

$("userbox").textContent = "👤 " + user;

$("rooms").innerHTML = ROOMS.map(r =>
  `<div class="room" data-id="${r.id}"><span class="dot" style="background:${r.color}"></span><span class="nm">${r.name}</span></div>`
).join("");
document.querySelectorAll(".room").forEach(el => el.onclick = () => {
  active = el.dataset.id; seen.clear(); $("msgs").innerHTML = "";
  renderHeader(); markActive(); $("sidebar").classList.remove("open");
  addNote("Entraste a la sala " + ROOMS.find(r=>r.id===active).name);
});
function markActive(){ document.querySelectorAll(".room").forEach(el => el.classList.toggle("active", el.dataset.id===active)); }
function renderHeader(){
  const r = ROOMS.find(r=>r.id===active);
  $("roomName").textContent = r.name;
  $("roomCount").textContent = "";
}
markActive(); renderHeader();

function scroll(){ $("msgs").scrollTop = $("msgs").scrollHeight; }
function addNote(t){
  $("msgs").insertAdjacentHTML("beforeend", `<div style="text-align:center;font-size:12px;color:var(--muted)">${esc(t)}</div>`);
  scroll();
}
function addMsg(m){
  const key = m.room + m.ts + m.user;
  if (seen.has(key)) return; seen.add(key);
  if (m.room !== active) return;
  const mine = m.user === user;
  $("msgs").insertAdjacentHTML("beforeend",
    `<div class="msg${mine?" mine":""}">
      <div class="av" style="background:${mine?"var(--accent)":hcolor(m.user)}">${initials(m.user)}</div>
      <div class="bdy"><div class="meta"><span class="u">${esc(m.user)}</span><span class="t">${m.h}</span></div>
      <div class="bbl">${esc(m.text)}</div></div>
    </div>`);
  scroll();
}

function send(){
  const text = $("inp").value.trim();
  if (!text) return;
  $("inp").value = "";
  const d = new Date();
  const m = {room:active, user, text, ts:d.getTime(), h:now()};
  addMsg(m);
  sb.channel("chat-rooms").send({type:"broadcast", event:"msg", payload:m});
}
$("send").onclick = send;
$("inp").addEventListener("keydown", e => { if (e.key==="Enter") send(); });
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");

// Realtime: recibir mensajes de todas las salas
sb.channel("chat-rooms")
  .on("broadcast", {event:"msg"}, ({payload}) => addMsg(payload))
  .subscribe(status => {
    $("conn").textContent = status === "SUBSCRIBED" ? "● en línea" : "conectando…";
    $("conn").style.color = status === "SUBSCRIBED" ? "#2ecc71" : "var(--muted)";
    if (status === "SUBSCRIBED") addNote("Conectado. Los mensajes son en vivo y no se guardan al cerrar (versión simple).");
  });

// PWA: instalar como app
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
